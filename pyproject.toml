[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11", "numpy>=1.21"]
build-backend = "scikit_build_core.build"

[project]
name = "trochoids"
version = "0.2.0"
description = "Fast C++/Python trochoid and Dubins path solver"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause-Clear" }
authors = [
  { name = "AirLab" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent"
]

[tool.scikit-build]
cmake.args = ["-DTROCHOIDS_BUILD_PYTHON=ON", "-DTROCHOIDS_BUILD_TESTS=OFF"]
